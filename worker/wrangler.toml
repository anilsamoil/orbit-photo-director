# Cloudflare Worker configuration for the calibration log + health endpoints.
# Deploy: wrangler deploy
# Dev:    wrangler dev

name = "orbit-photo-director"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Worker routes both map hosts. The Worker handles /api/log and
# /api/health directly; all other GETs are streamed from the SITE bucket
# (handleStatic). This way `/` correctly serves index.html — R2 alone doesn't
# do that for custom-domain bindings. map.expedition75.com stays on its own
# host. Leave the zone redirect enabled until this Worker is deployed and
# map.astroanil.dev still answers. Then disable the redirect. Re-enable it
# to roll back. Do not delete the rule.
routes = [
  { pattern = "map.astroanil.dev/*", zone_name = "astroanil.dev" },
  { pattern = "map.expedition75.com/*", zone_name = "expedition75.com" },
]

[[r2_buckets]]
binding = "SITE"
bucket_name = "map-astroanil-dev"

[[r2_buckets]]
binding = "CALIB"
bucket_name = "orbit-calib"

# Set the calibration shared secret via:
#   wrangler secret put CALIB_TOKEN
#
# Staleness alert threshold (seconds).
# 7200 = 2h. Generator ticks every 1h (geostationary IR refreshes every 10-15 min,
# so 1h ticks exercise the high-cadence data without thrashing). A tick that runs
# 5-10 min PLUS UptimeRobot's 5-min check can momentarily push past 1h without
# being a real outage. 2h absorbs that jitter and fires on genuine stalls.
[vars]
STALE_THRESHOLD_SECONDS = "7200"
ACCESS_TEAM_DOMAIN = "https://anilsamoil.cloudflareaccess.com"
# Public application audience, not a credential. Only the map app is trusted.
ACCESS_AUD = "af736f6a51f794ce6f0aefd9c9939168cbed99ba19251cbebe4a6c53dee59710"
# Comma-separated Access service-token client ids (JWT common_name).
# GET and HEAD /api/health are the only routes that accept one. Empty rejects
# every service token. The client secret stays in Access, not in this Worker.
ACCESS_SERVICE_TOKEN_CLIENT_IDS = ""

[observability]
enabled = true
