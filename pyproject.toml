[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-photo-director"
version = "0.1.0"
description = "Earth-photography planner for an ISS mission"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Anil Samoilenko" }]
dependencies = [
    "sgp4>=2.23",
    "numpy>=1.26",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "Pillow>=10.4",
    "requests>=2.31",
    "structlog>=24.1",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "freezegun>=1.4",
    "ruff>=0.4",
]

[project.scripts]
opd-tick = "generator.main:main"
opd-watch = "generator.daemon:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["generator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:netCDF4",
    "ignore::DeprecationWarning:xarray",
]

[tool.coverage.run]
source = ["generator"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S"]
# S105 false-positives on "terminator" regime literal in score.py
ignore = ["S101", "S105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "E501"]
