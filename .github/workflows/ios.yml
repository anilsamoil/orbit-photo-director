name: iOS unsigned

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'frontend/src/**'
      - 'frontend/index.html'
      - 'frontend/bun.lock'
      - 'frontend/package.json'
      - 'frontend/public/fonts/**'
      - 'frontend/public/glyphs/**'
      - 'frontend/public/ne_110m_coastline.geojson'
      - 'tests/fixtures/iss-2026-11-10.txt'
      - 'VERSION'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'frontend/src/**'
      - 'frontend/index.html'
      - 'frontend/bun.lock'
      - 'frontend/package.json'
      - 'frontend/public/fonts/**'
      - 'frontend/public/glyphs/**'
      - 'frontend/public/ne_110m_coastline.geojson'
      - 'tests/fixtures/iss-2026-11-10.txt'
      - 'VERSION'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

jobs:
  opdkit:
    name: OPDKit Swift Testing
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode and record runner inventory
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'ImageOS=%s\nImageVersion=%s\n' "$ImageOS" "$ImageVersion"
            sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
            version=$(xcodebuild -version)
            printf '%s\n' "$version"
            test "$version" = $'Xcode 26.6\nBuild version 17F113'
            swift --version
            xcrun simctl list runtimes
          } 2>&1 | tee "$RUNNER_TEMP/ios-environment.txt"
      - name: Test pure Swift package
        working-directory: app/OPDKit
        shell: bash
        run: |
          set -euo pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/opdkit-test.log"
      - name: Upload package test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opdkit-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/opdkit-test.log
            ${{ runner.temp }}/ios-environment.txt
          if-no-files-found: error
          retention-days: 14

  simulator:
    name: SNAP simulator launch (${{ matrix.device }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ipad-pro-m5
            device: iPad Pro 11-inch (M5)
          - id: iphone-17-pro
            device: iPhone 17 Pro
    env:
      DESTINATION: platform=iOS Simulator,name=${{ matrix.device }},OS=26.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode and record runner inventory
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'ImageOS=%s\nImageVersion=%s\n' "$ImageOS" "$ImageVersion"
            printf 'Destination=%s\n' "$DESTINATION"
            sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
            version=$(xcodebuild -version)
            printf '%s\n' "$version"
            test "$version" = $'Xcode 26.6\nBuild version 17F113'
            swift --version
            xcrun simctl list runtimes
            xcrun simctl list devices available
          } 2>&1 | tee "$RUNNER_TEMP/ios-environment.txt"
      - name: Prepare bundled placeholder
        run: python3 app/scripts/prepare-ios.py
      - name: Build and test unsigned simulator app
        id: launch
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -project app/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -onlyUsePackageVersionsFromResolvedFile \
            -destination "$DESTINATION" \
            -destination-timeout 60 \
            -only-testing:AppUITests/LaunchTests \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -resultBundlePath "$RUNNER_TEMP/SNAP-launch.xcresult" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            2>&1 | tee "$RUNNER_TEMP/ios-build.log"
      - name: Export test attachments
        if: always()
        shell: bash
        env:
          LAUNCH_OUTCOME: ${{ steps.launch.outcome }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/SNAP-launch.xcresult"
          attachments="$RUNNER_TEMP/SNAP-launch-attachments"
          if [[ -d "$result" ]]; then
            xcrun xcresulttool export attachments --path "$result" --output-path "$attachments"
          elif [[ "$LAUNCH_OUTCOME" == success ]]; then
            echo 'Successful launch test produced no xcresult bundle' >&2
            exit 1
          else
            echo 'No xcresult bundle exists; the build or simulator failed before test evidence was saved'
            exit 0
          fi
          if [[ "$LAUNCH_OUTCOME" == success ]]; then
            PYTHONPATH=app/scripts python3 -B - "$attachments" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          from check_ios_screenshot import validate_screenshot

          export_dir = Path(sys.argv[1])
          manifest_path = export_dir / "manifest.json"
          try:
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          except (OSError, ValueError) as error:
              raise SystemExit(f"Cannot read xcresult attachment manifest {manifest_path}: {error}")
          if not isinstance(manifest, list):
              raise SystemExit(f"Invalid xcresult attachment manifest {manifest_path}: expected a list of tests")

          test_id = "LaunchTests/testBundledPlaceholderLaunch()"
          # Xcode can append an attachment index and UUID to the readable name.
          screenshot_name = re.compile(r"SNAP-launch(?:_\d+_[0-9a-fA-F-]{36})?(?:\.png)?")
          found_attachment = False
          for test in manifest:
              if not isinstance(test, dict) or test.get("testIdentifier") != test_id:
                  continue
              attachments = test.get("attachments")
              if not isinstance(attachments, list):
                  continue
              for attachment in attachments:
                  if not isinstance(attachment, dict):
                      continue
                  name = attachment.get("suggestedHumanReadableName")
                  if not isinstance(name, str) or not screenshot_name.fullmatch(name):
                      continue
                  found_attachment = True
                  filename = attachment.get("exportedFileName")
                  if not isinstance(filename, str) or Path(filename).name != filename:
                      continue
                  png = export_dir / filename
                  if png.suffix.lower() == ".png" and png.is_file() and png.stat().st_size > 0:
                      try:
                          validate_screenshot(png, launch=True)
                      except (OSError, ValueError) as error:
                          raise SystemExit(f"Invalid SNAP-launch screenshot {filename} for {test_id}: {error}")
                      print(f"Verified SNAP-launch screenshot for {test_id}: {filename}")
                      sys.exit(0)

          if not found_attachment:
              raise SystemExit(f"No SNAP-launch attachment for {test_id} in {manifest_path}")
          raise SystemExit(f"SNAP-launch attachment for {test_id} does not reference a nonempty exported PNG")
          PY
          fi
      - name: Upload full test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-launch-results-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/SNAP-launch.xcresult
            ${{ runner.temp }}/ios-build.log
            ${{ runner.temp }}/ios-environment.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload exported screenshots and manifest
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-launch-screenshots-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/SNAP-launch-attachments
          if-no-files-found: warn
          retention-days: 14

  host-proof:
    name: SNAP host proof (${{ matrix.device }})
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ipad-pro-m5
            device: iPad Pro 11-inch (M5)
          - id: iphone-17-pro
            device: iPhone 17 Pro
    env:
      SIMULATOR_NAME: ${{ matrix.device }}
      SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5
      TEST_RUNNER_G1_STRESS_MS: '600000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode and simulator
        shell: bash
        run: |
          set -euo pipefail
          PROOF_OUTPUT="$RUNNER_TEMP/host-proof"
          mkdir -p "$PROOF_OUTPUT"
          printf 'PROOF_OUTPUT=%s\n' "$PROOF_OUTPUT" >> "$GITHUB_ENV"
          {
            printf 'ImageOS=%s\nImageVersion=%s\n' "$ImageOS" "$ImageVersion"
            sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
            version=$(xcodebuild -version)
            printf '%s\n' "$version"
            test "$version" = $'Xcode 26.6\nBuild version 17F113'
            swift --version
            xcrun simctl list runtimes
            xcrun simctl list devices available
          } 2>&1 | tee "$PROOF_OUTPUT/ios-environment.txt"
          simulator=$(xcrun simctl list devices available --json | python3 -c '
          import json, os, sys
          devices = json.load(sys.stdin)["devices"].get(os.environ["SIMULATOR_RUNTIME"], [])
          matching = [d["udid"] for d in devices if d["name"] == os.environ["SIMULATOR_NAME"]]
          if len(matching) != 1:
              sys.exit(f"Expected exactly one matching simulator, got {len(matching)}")
          print(matching[0])
          ')
          printf 'Simulator=%s (%s)\nRuntime=%s\n' "$SIMULATOR_NAME" "$simulator" "$SIMULATOR_RUNTIME" | tee -a "$PROOF_OUTPUT/ios-environment.txt"
          printf 'SIMULATOR_UDID=%s\n' "$simulator" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.3'
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Test, build and prepare proof assets
        run: |
          set -euo pipefail
          node --test app/host-proof/proof.test.mjs
          python3 -B app/scripts/test_export_host_proof.py
          node app/host-proof/build.mjs
          cp app/host-proof/dist/__g1/build.json "$PROOF_OUTPUT/build.json"
          python3 app/scripts/prepare-ios.py --host-proof
      - name: Run unsigned offline proof
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          python3 -u app/scripts/observe-host-proof.py "$SIMULATOR_UDID" > "$PROOF_OUTPUT/observer.log" 2>&1 &
          observer=$!
          stop_observer() {
            kill "$observer" 2>/dev/null || true
            wait "$observer" 2>/dev/null || true
          }
          trap stop_observer EXIT
          xcodebuild test \
            -project app/ios/App/App.xcodeproj \
            -scheme HostProof \
            -configuration HostProof \
            -onlyUsePackageVersionsFromResolvedFile \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 60 \
            -only-testing:AppUITests/HostProofTests \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 1800 \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -resultBundlePath "$PROOF_OUTPUT/SNAP-host-proof.xcresult" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$PROOF_OUTPUT/ios-build.log"
      - name: Export and validate host proof evidence
        if: always()
        shell: bash
        env:
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
        run: |
          set -euo pipefail
          PROOF_OUTPUT="$RUNNER_TEMP/host-proof"
          mkdir -p "$PROOF_OUTPUT"
          if [[ -d "$PROOF_OUTPUT/SNAP-host-proof.xcresult" ]]; then
            xcrun xcresulttool export attachments \
              --path "$PROOF_OUTPUT/SNAP-host-proof.xcresult" \
              --output-path "$PROOF_OUTPUT/attachments" || echo 'Attachment export failed' >&2
          fi
          # Validate screenshots for passing probes even when the overall XCTest run failed.
          export_status=0
          python3 -B app/scripts/export-host-proof.py "$PROOF_OUTPUT" "${PROOF_OUTCOME:-skipped}" || export_status=$?
          cat "$PROOF_OUTPUT/checks.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$export_status"
      - name: Upload host proof evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-host-proof-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/host-proof
          if-no-files-found: error
          retention-days: 14
