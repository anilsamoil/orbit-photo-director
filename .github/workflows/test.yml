name: test

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    name: Python (generator)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend
        run: cd frontend && bun install

      - name: Lint
        run: ruff check generator/ tests/

      - name: Test + coverage
        run: pytest tests/ --cov=generator --cov-fail-under=85

  worker:
    runs-on: ubuntu-latest
    name: Cloudflare Worker
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: cd worker && bun install
      - run: bash worker/deploy.test.sh
      - run: cd worker && bun run typecheck
      - run: cd worker && bun run test

  frontend:
    # Playwright 1.55.0 has no WebKit build for ubuntu 26.04. ubuntu-latest starts
    # moving there on 2026-10-19.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    name: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: cd frontend && bun install
      - run: cd frontend && bun run typecheck
      - run: bash scripts/upload_frontend.test.sh
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/bun.lock') }}
      - name: Install Playwright WebKit
        run: cd frontend && ./node_modules/.bin/playwright install --with-deps webkit
      # Each browser-backed file builds the app and launches real browsers.
      # Keep those files serial within the hosted runner's resource budget.
      - name: Test
        working-directory: frontend
        run: |
          set +e
          /usr/bin/time -v bun run test --maxWorkers=1 --minWorkers=1 --no-file-parallelism --reporter=verbose --reporter=json --outputFile.json=webkit-report.json
          status=$?
          set -e
          bun scripts/webkit-floor.ts webkit-report.json
          floor=$?
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          exit "$floor"
      - run: cd frontend && bun run build
