name: test

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    name: Python (generator)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend
        run: cd frontend && bun install

      - name: Lint
        run: ruff check generator/ tests/

      - name: Test + coverage
        run: pytest tests/ --cov=generator --cov-fail-under=85

  worker:
    runs-on: ubuntu-latest
    name: Cloudflare Worker
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: cd worker && bun install
      - run: bash worker/deploy.test.sh
      - run: cd worker && bun run typecheck
      - run: cd worker && bun run test

  frontend:
    runs-on: ubuntu-latest
    name: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: cd frontend && bun install
      - run: cd frontend && bun run typecheck
      - run: bash scripts/upload_frontend.test.sh
      # Each browser-backed file builds the app and launches real browsers.
      # Keep those files serial within the hosted runner's resource budget.
      # map-corner-lift.test.ts throws at load when Playwright WebKit is absent, which
      # fails this job before Chrome in that file runs. It is the next step.
      - run: cd frontend && /usr/bin/time -v bun run test --maxWorkers=1 --minWorkers=1 --no-file-parallelism --reporter=verbose --exclude test/map-corner-lift.test.ts
      - name: Install WebKit
        run: cd frontend && bunx playwright install --with-deps webkit
      - name: WebKit map checks
        run: cd frontend && bun run test test/map-corner-lift.test.ts test/legacy-launch-card.test.ts --maxWorkers=1 --minWorkers=1 --no-file-parallelism --reporter=verbose
      - run: cd frontend && bun run build
